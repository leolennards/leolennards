name: activity snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: draw the contribution snake in LEO//OS colors
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3dff9a&color_dots=#ebedf0,#b7f5d5,#7ff0b7,#3dff9a,#1c9e5f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3dff9a&color_dots=#0e151f,#1c6e47,#2bb673,#3dff9a,#9dffcc&color_background=#04060a

      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
